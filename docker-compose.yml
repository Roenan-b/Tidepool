services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memebot}
      POSTGRES_DB: memebot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memebot -d memebot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
