name: Feature request
description: Suggest an improvement.
title: 'feat: '
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        This repository does not accept outside pull requests, so describe the idea here instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: risk
    attributes:
      label: Does this touch funds, limits or signing?
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true
