name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memebot
          POSTGRES_PASSWORD: memebot
          POSTGRES_DB: memebot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://memebot:memebot@127.0.0.1:5432/memebot_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @tidepool/core
      - run: npm run typecheck
      - run: npm test
      - name: Dashboard build (demo data only)
        run: npx next build
        working-directory: apps/dashboard
        env:
          DEMO_MODE: 'true'
